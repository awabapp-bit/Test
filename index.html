<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السبورة الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --chrome:#1B1E25; --chrome-2:#22262F; --chrome-3:#2B303B;
    --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.16);
    --text:#E9EAEE; --text-dim:#9AA0AC;
    --accent:#FF6B35; --accent-dim:#FF6B3522;
    --board-white:#FBFAF6; --board-dark:#14161A; --board-slate:#0E2A2E;
    --danger:#EF4444;
  }
  [data-theme="light"]{
    --chrome:#F3F1EA; --chrome-2:#EAE7DD; --chrome-3:#E1DDD0;
    --line:rgba(0,0,0,0.08); --line-strong:rgba(0,0,0,0.14);
    --text:#22242A; --text-dim:#6B6D75;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --chrome:#F3F1EA; --chrome-2:#EAE7DD; --chrome-3:#E1DDD0;
      --line:rgba(0,0,0,0.08); --line-strong:rgba(0,0,0,0.14);
      --text:#22242A; --text-dim:#6B6D75;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--chrome);overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none;}
  body{
    font-family:'Cairo',sans-serif; color:var(--text);
    display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body.pseudo-fs{position:fixed;inset:0;width:100vw;height:100vh;z-index:2147483000;}

  #topbar{flex:0 0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--chrome-2);border-bottom:1px solid var(--line);gap:10px;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .brand .mark svg{width:19px;height:19px;stroke:#fff;}
  .brand-text{display:flex;flex-direction:column;min-width:0;}
  .brand-text b{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;}
  .brand-text span{font-size:11.5px;color:var(--text-dim);line-height:1.2;}
  #status-pill{font-size:12px;color:var(--text-dim);background:var(--chrome-3);border:1px solid var(--line);padding:5px 12px;border-radius:20px;white-space:nowrap;}
  .top-actions{display:flex;align-items:center;gap:8px;position:relative;}
  .icon-btn{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--chrome-3);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn.solid{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ===== layout popover (choose toolbar / settings-bar placement) ===== */
  #layout-panel{
    position:absolute; top:calc(100% + 10px); left:0;
    background:var(--chrome-2); border:1px solid var(--line-strong); border-radius:16px;
    padding:14px; width:250px; display:none; flex-direction:column; gap:12px;
    box-shadow:0 12px 30px rgba(0,0,0,0.32); z-index:70;
  }
  #layout-panel.show{display:flex;}
  .lp-title{font-size:12px;font-weight:700;color:var(--text-dim);}
  .lp-row{display:flex;gap:6px;flex-wrap:wrap;}
  .lp-chip{flex:1 1 auto;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--chrome-3);color:var(--text-dim);font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;}
  .lp-chip.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}

  #workspace{position:relative;flex:1 1 auto;min-height:0;display:flex;}
  #workspace.tb-right{flex-direction:row;}
  #workspace.tb-right #toolbar{order:1;border-left:1px solid var(--line);border-top:none;}
  #workspace.tb-right #viewport{order:2;}
  #workspace.tb-left{flex-direction:row;}
  #workspace.tb-left #toolbar{order:2;border-right:1px solid var(--line);border-left:none;}
  #workspace.tb-left #viewport{order:1;}
  #workspace.tb-top{flex-direction:column;}
  #workspace.tb-top #toolbar{order:1;}
  #workspace.tb-top #viewport{order:2;}
  #workspace.tb-bottom{flex-direction:column;}
  #workspace.tb-bottom #toolbar{order:2;}
  #workspace.tb-bottom #viewport{order:1;}
  #workspace.tb-top #toolbar,#workspace.tb-bottom #toolbar{
    width:100%;height:auto;flex-direction:row;border-left:none;border-right:none;padding:8px 12px;overflow-x:auto;overflow-y:hidden;
  }
  #workspace.tb-top #toolbar{border-bottom:1px solid var(--line);}
  #workspace.tb-bottom #toolbar{border-top:1px solid var(--line);}
  #workspace.tb-top .tool-sep,#workspace.tb-bottom .tool-sep{width:1px;height:36px;margin:0 6px;}

  #viewport{position:relative;flex:1 1 auto;overflow:hidden;background:var(--board-white);min-width:0;min-height:0;}
  #viewport.bg-dark{background:var(--board-dark);}
  #viewport.bg-slate{background:var(--board-slate);}
  #board-content{position:absolute;top:0;left:0;width:3600px;height:2400px;transform-origin:0 0;--dot-color: rgba(0,0,0,0.12);}
  #viewport.bg-dark #board-content, #viewport.bg-slate #board-content{--dot-color: rgba(255,255,255,0.12);}
  #board-content.pattern-dots{background-image:radial-gradient(circle, var(--dot-color) 1.6px, transparent 1.6px);background-size:34px 34px;}
  #board-content.pattern-lines{background-image:repeating-linear-gradient(to bottom, transparent 0px, transparent 37px, var(--dot-color) 37px, var(--dot-color) 38px);background-size:100% 38px;}
  #board-content.pattern-none{background-image:none;}

  #draw-canvas, #preview-canvas{position:absolute;top:0;left:0;width:3600px;height:2400px;touch-action:none;}
  #preview-canvas{pointer-events:none;}
  #text-layer{position:absolute;top:0;left:0;width:3600px;height:2400px;}
  .board-text{
    position:absolute;min-width:24px;min-height:1.3em;outline:none;white-space:pre-wrap;word-break:break-word;
    line-height:1.4;letter-spacing:0.1px;cursor:text;-webkit-user-select:text;user-select:text;padding:3px 6px;border-radius:5px;
    font-family:'Cairo',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .board-text.editing{box-shadow:0 0 0 2px var(--accent);background:rgba(255,107,53,0.07);}
  .board-text.bold{font-weight:700;}

  #toolbar{flex:0 0 auto;width:84px;background:var(--chrome-2);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;overflow-y:auto;z-index:30;}
  .tool-btn{width:60px;height:56px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;flex:0 0 auto;}
  .tool-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .tool-btn span{font-size:10.5px;font-weight:600;}
  .tool-btn:active{transform:scale(0.95);}
  .tool-btn.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .tool-sep{width:44px;height:1px;background:var(--line);margin:6px 0;flex:0 0 auto;}

  #zoom-dock{position:absolute;bottom:16px;left:16px;display:flex;align-items:center;gap:4px;background:var(--chrome-2);border:1px solid var(--line);border-radius:14px;padding:4px;z-index:35;}
  #zoom-dock button{width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  #zoom-dock button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
  #zoom-dock button:active{background:var(--chrome-3);}
  #zoom-pct{font-size:12px;color:var(--text-dim);min-width:42px;text-align:center;font-weight:600;}

  /* ===== compact settings bar (repositionable) ===== */
  #context-bar{
    position:absolute; opacity:0; pointer-events:none;
    transition:transform .18s ease, opacity .18s ease;
    background:var(--chrome-2); border:1px solid var(--line-strong); border-radius:16px;
    padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,0.28);
    display:flex; flex-direction:column; gap:9px; z-index:45;
  }
  #context-bar.show{opacity:1; pointer-events:auto;}
  #context-bar.cb-bottom{left:50%;bottom:16px;transform:translateX(-50%) translateY(14px);max-width:min(92vw,520px);}
  #context-bar.cb-bottom.show{transform:translateX(-50%) translateY(0);}
  #context-bar.cb-top{left:50%;top:16px;transform:translateX(-50%) translateY(-14px);max-width:min(92vw,520px);}
  #context-bar.cb-top.show{transform:translateX(-50%) translateY(0);}
  #context-bar.cb-side-right{right:16px;top:50%;transform:translateY(-50%) translateX(14px);width:220px;}
  #context-bar.cb-side-right.show{transform:translateY(-50%) translateX(0);}
  #context-bar.cb-side-left{left:16px;top:50%;transform:translateY(-50%) translateX(-14px);width:220px;}
  #context-bar.cb-side-left.show{transform:translateY(-50%) translateX(0);}

  .ctx-title{font-size:11.5px;font-weight:700;color:var(--text-dim);}
  .ctx-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .ctx-label{font-size:11.5px;color:var(--text-dim);font-weight:600;flex:0 0 auto;}
  .color-row{position:relative;}
  .ctx-color-btn{width:32px;height:32px;border-radius:10px;border:2px solid var(--line-strong);cursor:pointer;padding:0;flex:0 0 auto;}
  .color-popover{
    position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:var(--chrome-3);border:1px solid var(--line-strong);border-radius:14px;
    padding:10px;display:none;flex-direction:row;flex-wrap:wrap;gap:8px;width:192px;z-index:55;
    box-shadow:0 10px 26px rgba(0,0,0,0.32);
  }
  .color-popover.show{display:flex;}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);cursor:pointer;padding:0;flex:0 0 auto;}
  .swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--accent);}
  .custom-color{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);padding:0;overflow:hidden;background:none;cursor:pointer;}
  .custom-color::-webkit-color-swatch-wrapper{padding:0;}
  .custom-color::-webkit-color-swatch{border:none;border-radius:50%;}
  .ctx-range{width:130px;accent-color:var(--accent);}
  .shape-opt{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--chrome-3);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .shape-opt svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .shape-opt.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .toggle-chip{padding:6px 13px;border-radius:9px;border:1px solid var(--line);background:var(--chrome-3);color:var(--text-dim);font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
  .toggle-chip.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .ctx-hint{font-size:11px;color:var(--text-dim);}
  .mini-zoom-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--chrome-3);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .mini-zoom-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}

  #toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--chrome-3);border:1px solid var(--line-strong);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:60;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  #confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:80;}
  #confirm-overlay.show{display:flex;}
  #confirm-box{background:var(--chrome-2);border:1px solid var(--line-strong);border-radius:16px;padding:22px;width:280px;text-align:center;}
  #confirm-box p{font-size:14px;margin:0 0 16px;color:var(--text);}
  #confirm-box .row{display:flex;gap:10px;}
  #confirm-box button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--chrome-3);color:var(--text);font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;}
  #confirm-box button.danger{background:var(--danger);border-color:var(--danger);color:#fff;}

  @media (max-width:640px){
    #toolbar{width:68px;}
    #workspace.tb-top #toolbar,#workspace.tb-bottom #toolbar{width:100%;height:auto;}
    .tool-btn{width:50px;height:50px;}
    .tool-btn span{display:none;}
    .brand-text span{display:none;}
    #status-pill{display:none;}
    #context-bar.cb-side-right,#context-bar.cb-side-left{width:180px;}
  }
</style>
</head>
<body>

  <div id="topbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H19.5C20.3 4 21 4.7 21 5.5V16.5C21 17.3 20.3 18 19.5 18H13L8 21V18H4.5C3.7 18 3 17.3 3 16.5V5.5Z" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 8.5H17M7 12H13" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <b>السبورة الذكية</b>
        <span>لوحة عرض تفاعلية للشاشات الكبيرة</span>
      </div>
    </div>
    <div class="top-actions">
      <span id="status-pill">جاهزة للكتابة</span>
      <button class="icon-btn" id="btn-layout" title="ترتيب الشاشة">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.5h17M9 9.5V21"/></svg>
      </button>
      <div id="layout-panel">
        <div>
          <div class="lp-title">مكان الشريط الجانبي</div>
          <div class="lp-row" id="lp-toolbar">
            <button class="lp-chip" data-pos="right">يمين</button>
            <button class="lp-chip" data-pos="left">يسار</button>
            <button class="lp-chip" data-pos="top">أعلى</button>
            <button class="lp-chip" data-pos="bottom">أسفل</button>
          </div>
        </div>
        <div>
          <div class="lp-title">مكان شريط الإعدادات</div>
          <div class="lp-row" id="lp-context">
            <button class="lp-chip" data-pos="bottom">أسفل</button>
            <button class="lp-chip" data-pos="top">أعلى</button>
            <button class="lp-chip" data-pos="side-right">يمين اللوحة</button>
            <button class="lp-chip" data-pos="side-left">يسار اللوحة</button>
          </div>
        </div>
      </div>
      <button class="icon-btn" id="btn-save" title="حفظ كصورة">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg>
      </button>
      <button class="icon-btn solid" id="btn-fullscreen" title="ملء الشاشة">
        <svg viewBox="0 0 24 24" id="fs-icon"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
      </button>
    </div>
  </div>

  <div id="workspace" class="tb-right">
    <div id="viewport">
      <div id="board-content" class="pattern-dots">
        <canvas id="draw-canvas" width="3600" height="2400"></canvas>
        <canvas id="preview-canvas" width="3600" height="2400"></canvas>
        <div id="text-layer"></div>
      </div>

      <div id="context-bar" class="cb-bottom"></div>

      <div id="zoom-dock">
        <button id="zoom-out" title="تصغير"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <span id="zoom-pct">100%</span>
        <button id="zoom-in" title="تكبير"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zoom-reset" title="إعادة الضبط"><svg viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M4.5 9A7.5 7.5 0 0 1 19 9M19.5 15a7.5 7.5 0 0 1-14.5 0"/></svg></button>
      </div>

      <div id="toast"></div>
    </div>

    <div id="toolbar">
      <button class="tool-btn" data-tool="move" title="تحريك وتكبير">
        <svg viewBox="0 0 24 24"><path d="M12 3v5M12 21v-5M3 12h5M21 12h-5M12 3l-2 2M12 3l2 2M12 21l-2-2M12 21l2-2M3 12l2-2M3 12l2 2M21 12l-2-2M21 12l-2 2"/></svg>
        <span>تحريك</span>
      </button>
      <button class="tool-btn active" data-tool="pen" title="قلم">
        <svg viewBox="0 0 24 24"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20z"/><path d="M13.5 6.5 17.5 10.5"/></svg>
        <span>قلم</span>
      </button>
      <button class="tool-btn" data-tool="highlighter" title="ماركر">
        <svg viewBox="0 0 24 24"><path d="M9 15 4 20M6.5 17.5 15 9l3.5 3.5L10 21H6.5z"/><path d="M12.5 5.5 18.5 11.5 20.5 9.5 14.5 3.5z"/></svg>
        <span>ماركر</span>
      </button>
      <button class="tool-btn" data-tool="eraser" title="ممحاة">
        <svg viewBox="0 0 24 24"><path d="M18 13 9 4a1.5 1.5 0 0 0-2 0L3 8a1.5 1.5 0 0 0 0 2l8.5 8.5H16"/><path d="M8.5 20h11"/></svg>
        <span>ممحاة</span>
      </button>
      <button class="tool-btn" data-tool="text" title="نص">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg>
        <span>كتابة</span>
      </button>
      <button class="tool-btn" data-tool="shape" title="أشكال">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="8" height="8" rx="1.3"/><circle cx="16.5" cy="16.5" r="4.3"/></svg>
        <span>أشكال</span>
      </button>

      <div class="tool-sep"></div>

      <button class="tool-btn" id="btn-undo" title="تراجع">
        <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
        <span>تراجع</span>
      </button>
      <button class="tool-btn" id="btn-redo" title="إعادة">
        <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg>
        <span>إعادة</span>
      </button>
      <button class="tool-btn" id="btn-clear" title="مسح الكل">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>
        <span>مسح الكل</span>
      </button>

      <div class="tool-sep"></div>

      <button class="tool-btn" id="btn-grid" title="نمط الخلفية">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M9 3.5v17M14.5 3.5v17M3.5 9h17M3.5 14.5h17"/></svg>
        <span>الشبكة</span>
      </button>
      <button class="tool-btn" id="btn-bg" title="خلفية اللوحة">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17"/></svg>
        <span>الخلفية</span>
      </button>
    </div>
  </div>

  <div id="confirm-overlay">
    <div id="confirm-box">
      <p>هل تريد مسح كل محتوى اللوحة؟ لا يمكن التراجع عن هذا بعد المسح.</p>
      <div class="row">
        <button id="confirm-cancel">إلغاء</button>
        <button class="danger" id="confirm-ok">مسح الكل</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var workspace = document.getElementById('workspace');
  var viewport = document.getElementById('viewport');
  var boardContent = document.getElementById('board-content');
  var canvas = document.getElementById('draw-canvas');
  var preview = document.getElementById('preview-canvas');
  var ctx = canvas.getContext('2d');
  var pctx = preview.getContext('2d');
  var textLayer = document.getElementById('text-layer');
  var contextBar = document.getElementById('context-bar');
  var toastEl = document.getElementById('toast');

  var BOARD_W = 3600, BOARD_H = 2400;

  var tools = {
    pen:         { color:'#1F2933', size:4,  palette:['#1F2933','#E24B4A','#378ADD','#639922','#7F77DD','#EF9F27','#FFFFFF'] },
    highlighter: { color:'#FFD54A', size:18, palette:['#FFD54A','#7BE0A0','#7EC8FF','#FF9FD1','#FFB067','#C9A4FF'] },
    eraser:      { size:26 },
    text:        { color:'#1F2933', size:26, bold:false, palette:['#1F2933','#E24B4A','#378ADD','#639922','#7F77DD','#EF9F27','#FFFFFF'] },
    shape:       { color:'#1F2933', size:5, shape:'rect', palette:['#1F2933','#E24B4A','#378ADD','#639922','#7F77DD','#EF9F27','#FFFFFF'] }
  };

  var state = { tool:'pen', pan:{x:0,y:0}, zoom:1, pattern:0, bgMode:0 };
  var patterns = ['pattern-dots','pattern-lines','pattern-none'];
  var patternLabels = ['نقاط', 'أسطر', 'بدون نمط'];
  var bgModes = ['', 'bg-dark', 'bg-slate'];
  var bgLabels = ['أبيض', 'داكن', 'أخضر لوحي'];

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1700);
  }

  /* ---------- layout (toolbar / settings-bar placement) ---------- */
  var layout = { toolbar:'right', context:'bottom' };
  function applyLayout(){
    ['tb-right','tb-left','tb-top','tb-bottom'].forEach(function(c){ workspace.classList.remove(c); });
    workspace.classList.add('tb-'+layout.toolbar);
    ['cb-bottom','cb-top','cb-side-right','cb-side-left'].forEach(function(c){ contextBar.classList.remove(c); });
    contextBar.classList.add('cb-'+layout.context);
    document.querySelectorAll('#lp-toolbar .lp-chip').forEach(function(b){ b.classList.toggle('active', b.dataset.pos===layout.toolbar); });
    document.querySelectorAll('#lp-context .lp-chip').forEach(function(b){ b.classList.toggle('active', b.dataset.pos===layout.context); });
    requestAnimationFrame(function(){ clampPan(); applyTransform(); });
  }
  document.querySelectorAll('#lp-toolbar .lp-chip').forEach(function(b){
    b.addEventListener('click', function(){ layout.toolbar = b.dataset.pos; applyLayout(); });
  });
  document.querySelectorAll('#lp-context .lp-chip').forEach(function(b){
    b.addEventListener('click', function(){ layout.context = b.dataset.pos; applyLayout(); renderContextBar(); });
  });
  var layoutBtn = document.getElementById('btn-layout');
  var layoutPanel = document.getElementById('layout-panel');
  layoutBtn.addEventListener('click', function(e){ e.stopPropagation(); layoutPanel.classList.toggle('show'); });
  document.addEventListener('click', function(e){
    if(!layoutPanel.contains(e.target) && e.target !== layoutBtn){ layoutPanel.classList.remove('show'); }
    document.querySelectorAll('.color-popover.show').forEach(function(p){
      if(!p.contains(e.target) && !p.previousSibling.contains(e.target) && p.parentElement && !p.parentElement.contains(e.target)){ /* handled below more simply */ }
    });
  });

  /* ---------- transform ---------- */
  function applyTransform(){
    boardContent.style.transform = 'translate('+state.pan.x+'px,'+state.pan.y+'px) scale('+state.zoom+')';
    document.getElementById('zoom-pct').textContent = Math.round(state.zoom*100)+'%';
  }
  function clampPan(){
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var cw = BOARD_W*state.zoom, ch = BOARD_H*state.zoom;
    var minX = Math.min(0, vw-cw), minY = Math.min(0, vh-ch);
    state.pan.x = Math.max(minX, Math.min(0, state.pan.x));
    state.pan.y = Math.max(minY, Math.min(0, state.pan.y));
  }
  function centerInit(){
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    state.pan.x = Math.min(0,(vw-BOARD_W)/2);
    state.pan.y = Math.min(0,(vh-BOARD_H)/2);
    clampPan(); applyTransform();
  }
  window.addEventListener('resize', function(){ clampPan(); applyTransform(); });

  function screenToBoard(clientX, clientY){
    var r = viewport.getBoundingClientRect();
    return { x:(clientX-r.left-state.pan.x)/state.zoom, y:(clientY-r.top-state.pan.y)/state.zoom };
  }

  function setZoom(z, anchorClientX, anchorClientY){
    z = Math.max(0.4, Math.min(3, z));
    var r = viewport.getBoundingClientRect();
    var ax = anchorClientX!==undefined ? anchorClientX-r.left : viewport.clientWidth/2;
    var ay = anchorClientY!==undefined ? anchorClientY-r.top : viewport.clientHeight/2;
    var boardX = (ax-state.pan.x)/state.zoom, boardY = (ay-state.pan.y)/state.zoom;
    state.zoom = z;
    state.pan.x = ax-boardX*state.zoom;
    state.pan.y = ay-boardY*state.zoom;
    clampPan(); applyTransform();
  }
  document.getElementById('zoom-in').addEventListener('click', function(){ setZoom(state.zoom+0.15); });
  document.getElementById('zoom-out').addEventListener('click', function(){ setZoom(state.zoom-0.15); });
  document.getElementById('zoom-reset').addEventListener('click', function(){ state.zoom=1; centerInit(); });

  /* ---------- compact settings bar builder ---------- */
  function el(tag, attrs){
    var e = document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    return e;
  }

  function colorSwatchControl(cfg){
    var wrap = el('div',{class:'color-row'});
    var btn = el('button',{class:'ctx-color-btn'});
    btn.style.background = cfg.color;
    var pop = el('div',{class:'color-popover'});
    cfg.palette.forEach(function(c){
      var s = el('button',{class:'swatch'+(cfg.color===c?' active':'')});
      s.style.background = c;
      if(c==='#FFFFFF') s.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,0.2)';
      s.addEventListener('click', function(){
        cfg.color = c; btn.style.background = c;
        pop.querySelectorAll('.swatch').forEach(function(x){x.classList.remove('active');});
        s.classList.add('active');
        pop.classList.remove('show');
      });
      pop.appendChild(s);
    });
    var custom = el('input',{type:'color', class:'custom-color', value:cfg.color});
    custom.addEventListener('input', function(){
      cfg.color = custom.value; btn.style.background = custom.value;
      pop.querySelectorAll('.swatch').forEach(function(x){x.classList.remove('active');});
    });
    pop.appendChild(custom);
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      document.querySelectorAll('.color-popover.show').forEach(function(p){ if(p!==pop) p.classList.remove('show'); });
      pop.classList.toggle('show');
    });
    wrap.appendChild(btn);
    wrap.appendChild(pop);
    return wrap;
  }

  function colorAndSizeRow(cfg, sizeMin, sizeMax, sizeSuffix){
    var row = el('div',{class:'ctx-row'});
    row.appendChild(colorSwatchControl(cfg));
    var range = el('input',{type:'range', class:'ctx-range', min:sizeMin, max:sizeMax, value:cfg.size});
    var out = el('span',{class:'ctx-hint'}); out.textContent = cfg.size+(sizeSuffix||'');
    range.addEventListener('input', function(){
      cfg.size = parseInt(range.value,10);
      out.textContent = cfg.size+(sizeSuffix||'');
    });
    row.appendChild(range); row.appendChild(out);
    return row;
  }

  function sizeOnlyRow(label, min, max, cfg, key, suffix){
    var row = el('div',{class:'ctx-row'});
    var lbl = el('span',{class:'ctx-label'}); lbl.textContent = label; row.appendChild(lbl);
    var range = el('input',{type:'range', class:'ctx-range', min:min, max:max, value:cfg[key]});
    var out = el('span',{class:'ctx-hint'}); out.textContent = cfg[key]+(suffix||'');
    range.addEventListener('input', function(){
      cfg[key] = parseInt(range.value,10);
      out.textContent = cfg[key]+(suffix||'');
    });
    row.appendChild(range); row.appendChild(out);
    return row;
  }

  function renderContextBar(){
    contextBar.innerHTML = '';
    var tool = state.tool;
    contextBar.classList.add('show');

    if(tool === 'pen'){
      contextBar.appendChild(colorAndSizeRow(tools.pen, 1, 30, 'px'));
    } else if(tool === 'highlighter'){
      contextBar.appendChild(colorAndSizeRow(tools.highlighter, 8, 45, 'px'));
    } else if(tool === 'eraser'){
      contextBar.appendChild(sizeOnlyRow('حجم الممحاة', 10, 90, tools.eraser, 'size', 'px'));
    } else if(tool === 'text'){
      contextBar.appendChild(colorAndSizeRow(tools.text, 14, 96, 'px'));
      var boldRow = el('div',{class:'ctx-row'});
      var boldChip = el('button',{class:'toggle-chip'+(tools.text.bold?' active':'')});
      boldChip.textContent = 'خط غامق';
      boldChip.addEventListener('click', function(){
        tools.text.bold = !tools.text.bold;
        boldChip.classList.toggle('active', tools.text.bold);
      });
      boldRow.appendChild(boldChip);
      contextBar.appendChild(boldRow);
    } else if(tool === 'shape'){
      var shapeRow = el('div',{class:'ctx-row'});
      [['line','M4 20 20 4'],['arrow','M4 20 20 4M20 4h-7M20 4v7'],['rect',null],['ellipse',null]].forEach(function(pair){
        var name = pair[0];
        var b = el('button',{class:'shape-opt'+(tools.shape.shape===name?' active':'')});
        var svgHtml = name==='rect' ? '<rect x="4" y="6" width="16" height="12" rx="1.5"/>' :
                      name==='ellipse' ? '<ellipse cx="12" cy="12" rx="8" ry="6.5"/>' :
                      '<path d="'+pair[1]+'"/>';
        b.innerHTML = '<svg viewBox="0 0 24 24">'+svgHtml+'</svg>';
        b.addEventListener('click', function(){
          tools.shape.shape = name;
          shapeRow.querySelectorAll('.shape-opt').forEach(function(s){s.classList.remove('active');});
          b.classList.add('active');
        });
        shapeRow.appendChild(b);
      });
      contextBar.appendChild(shapeRow);
      contextBar.appendChild(colorAndSizeRow(tools.shape, 1, 30, 'px'));
    } else if(tool === 'move'){
      var zr = el('div',{class:'ctx-row'});
      var zOut = el('button',{class:'mini-zoom-btn'}); zOut.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>';
      zOut.addEventListener('click', function(){ setZoom(state.zoom-0.15); });
      var zIn = el('button',{class:'mini-zoom-btn'}); zIn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
      zIn.addEventListener('click', function(){ setZoom(state.zoom+0.15); });
      var zReset = el('button',{class:'mini-zoom-btn'}); zReset.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M4.5 9A7.5 7.5 0 0 1 19 9M19.5 15a7.5 7.5 0 0 1-14.5 0"/></svg>';
      zReset.addEventListener('click', function(){ state.zoom=1; centerInit(); });
      var zl = el('span',{class:'ctx-label'}); zl.textContent = 'التكبير';
      zr.appendChild(zl); zr.appendChild(zOut); zr.appendChild(zIn); zr.appendChild(zReset);
      contextBar.appendChild(zr);
      var hint = el('div',{class:'ctx-hint'}); hint.textContent = 'اسحب بإصبع للتحريك، أو إصبعين للتكبير والتصغير';
      contextBar.appendChild(hint);
    }
  }

  var toolButtons = document.querySelectorAll('.tool-btn[data-tool]');
  var lastDrawTool = 'pen';
  function setTool(tool){
    if(tool !== 'move'){ lastDrawTool = tool; }
    state.tool = tool;
    toolButtons.forEach(function(b){ b.classList.toggle('active', b.dataset.tool===tool); });
    viewport.style.cursor = tool==='move' ? 'grab' : (tool==='text' ? 'text' : 'crosshair');
    var labels = {move:'تحريك وتكبير',pen:'وضع القلم',highlighter:'وضع الماركر',eraser:'وضع الممحاة',text:'اضغط لإضافة نص',shape:'ارسم شكلًا بالسحب'};
    document.getElementById('status-pill').textContent = labels[tool] || 'جاهزة';
    renderContextBar();
  }
  toolButtons.forEach(function(b){ b.addEventListener('click', function(){ setTool(b.dataset.tool); }); });

  document.getElementById('btn-grid').addEventListener('click', function(){
    state.pattern = (state.pattern+1) % patterns.length;
    patterns.forEach(function(p){ boardContent.classList.remove(p); });
    boardContent.classList.add(patterns[state.pattern]);
    showToast('نمط الخلفية: '+patternLabels[state.pattern]);
  });
  document.getElementById('btn-bg').addEventListener('click', function(){
    state.bgMode = (state.bgMode+1) % bgModes.length;
    bgModes.forEach(function(m){ if(m) viewport.classList.remove(m); });
    if(bgModes[state.bgMode]) viewport.classList.add(bgModes[state.bgMode]);
    showToast('الخلفية: '+bgLabels[state.bgMode]);
  });

  /* ---------- history ---------- */
  var history = [];
  var histIndex = -1;
  var MAX_HIST = 40;

  function serializeTexts(){
    var arr = [];
    textLayer.querySelectorAll('.board-text').forEach(function(elx){
      arr.push({ text:elx.textContent, left:elx.style.left, top:elx.style.top, color:elx.style.color, fontSize:elx.style.fontSize, bold:elx.classList.contains('bold') });
    });
    return arr;
  }
  function restoreTexts(arr){
    textLayer.innerHTML = '';
    arr.forEach(function(t){
      var elx = makeTextEl(t.left, t.top, t.color, t.fontSize, t.bold);
      elx.textContent = t.text;
    });
  }
  function pushHistory(){
    history = history.slice(0, histIndex+1);
    history.push({ img: canvas.toDataURL('image/png'), texts: serializeTexts() });
    if(history.length > MAX_HIST) history.shift();
    histIndex = history.length-1;
  }
  function applyHistoryEntry(entry){
    var img = new Image();
    img.onload = function(){
      ctx.clearRect(0,0,BOARD_W,BOARD_H);
      ctx.drawImage(img,0,0);
      restoreTexts(entry.texts);
    };
    img.src = entry.img;
  }
  function undo(){
    if(histIndex <= 0){ if(history.length===0) pushHistory(); return; }
    histIndex--; applyHistoryEntry(history[histIndex]);
  }
  function redo(){
    if(histIndex >= history.length-1) return;
    histIndex++; applyHistoryEntry(history[histIndex]);
  }
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-redo').addEventListener('click', redo);
  pushHistory();

  var confirmOverlay = document.getElementById('confirm-overlay');
  document.getElementById('btn-clear').addEventListener('click', function(){ confirmOverlay.classList.add('show'); });
  document.getElementById('confirm-cancel').addEventListener('click', function(){ confirmOverlay.classList.remove('show'); });
  document.getElementById('confirm-ok').addEventListener('click', function(){
    ctx.clearRect(0,0,BOARD_W,BOARD_H);
    textLayer.innerHTML = '';
    pushHistory();
    confirmOverlay.classList.remove('show');
    showToast('تم مسح اللوحة');
  });

  /* ---------- text tool ---------- */
  function makeTextEl(left, top, color, fontSize, bold){
    var elx = document.createElement('div');
    elx.className = 'board-text'+(bold?' bold':'');
    elx.contentEditable = 'true';
    elx.spellcheck = false;
    elx.style.left = left; elx.style.top = top;
    elx.style.color = color || tools.text.color;
    elx.style.fontSize = fontSize || (tools.text.size+'px');
    textLayer.appendChild(elx);
    var committed = false;
    function commit(){
      if(committed) return;
      committed = true;
      elx.classList.remove('editing');
      elx.contentEditable = 'false';
      if(elx.textContent.trim()===''){ elx.remove(); } else { pushHistory(); }
    }
    elx.addEventListener('blur', commit);
    elx.addEventListener('keydown', function(e){ if(e.key==='Escape'){ e.preventDefault(); elx.blur(); } });
    elx.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    return elx;
  }

  /* ---------- smooth single-pass stroke rendering (fixes uneven/grainy opacity) ---------- */
  function strokeSmoothPath(context, pts, width){
    if(pts.length === 1){
      context.beginPath();
      context.arc(pts[0].x, pts[0].y, width/2, 0, Math.PI*2);
      context.fill();
      return;
    }
    context.beginPath();
    context.moveTo(pts[0].x, pts[0].y);
    for(var i=1; i<pts.length-1; i++){
      var mx = (pts[i].x+pts[i+1].x)/2, my = (pts[i].y+pts[i+1].y)/2;
      context.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    context.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    context.stroke();
  }

  var drawing = false;
  var currentPts = [];
  var lastPt = null;
  var startPt = null;
  var panning = false;
  var panStart = null;
  var panOrigin = null;
  var downPos = null;
  var lastTapTime = 0;
  var lastTapPos = null;

  function handleTapSequence(isTap, e){
    var now = Date.now();
    var pos = {x:e.clientX, y:e.clientY};
    if(isTap){
      if(lastTapTime && (now-lastTapTime)<350 && lastTapPos && distanceOf(pos,lastTapPos)<40){
        if(state.tool === 'move'){
          setTool(lastDrawTool);
          var toolLabels = {pen:'القلم', highlighter:'الماركر', eraser:'الممحاة', text:'النص', shape:'الأشكال'};
          showToast('تم التحويل لوضع '+(toolLabels[lastDrawTool]||'الرسم'));
        } else {
          setTool('move');
          showToast('تم التحويل لوضع التحريك');
        }
        lastTapTime = 0; lastTapPos = null;
      } else {
        lastTapTime = now; lastTapPos = pos;
      }
    } else {
      lastTapTime = 0; lastTapPos = null;
    }
  }

  function drawLivePenStroke(){
    pctx.clearRect(0,0,BOARD_W,BOARD_H);
    var isHi = state.tool === 'highlighter';
    var cfg = isHi ? tools.highlighter : tools.pen;
    pctx.lineJoin='round'; pctx.lineCap='round';
    pctx.globalAlpha = isHi ? 0.32 : 1;
    pctx.strokeStyle = cfg.color;
    pctx.fillStyle = cfg.color;
    pctx.lineWidth = cfg.size;
    strokeSmoothPath(pctx, currentPts, cfg.size);
  }
  function commitPenStroke(){
    var isHi = state.tool === 'highlighter';
    var cfg = isHi ? tools.highlighter : tools.pen;
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = isHi ? 0.32 : 1;
    ctx.strokeStyle = cfg.color;
    ctx.fillStyle = cfg.color;
    ctx.lineWidth = cfg.size;
    strokeSmoothPath(ctx, currentPts, cfg.size);
    ctx.globalAlpha = 1;
    pctx.clearRect(0,0,BOARD_W,BOARD_H);
  }

  function drawShapePreview(shape, from, to, color, size){
    pctx.clearRect(0,0,BOARD_W,BOARD_H);
    pctx.lineJoin='round'; pctx.lineCap='round';
    pctx.strokeStyle = color; pctx.lineWidth = size; pctx.globalAlpha=1;
    pctx.beginPath();
    if(shape==='line'){ pctx.moveTo(from.x,from.y); pctx.lineTo(to.x,to.y); }
    else if(shape==='rect'){ pctx.rect(Math.min(from.x,to.x),Math.min(from.y,to.y),Math.abs(to.x-from.x),Math.abs(to.y-from.y)); }
    else if(shape==='ellipse'){ var cx=(from.x+to.x)/2,cy=(from.y+to.y)/2,rx=Math.abs(to.x-from.x)/2,ry=Math.abs(to.y-from.y)/2; pctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); }
    else if(shape==='arrow'){
      var ang=Math.atan2(to.y-from.y,to.x-from.x), headLen=Math.max(14,size*3.2);
      pctx.moveTo(from.x,from.y); pctx.lineTo(to.x,to.y);
      pctx.moveTo(to.x,to.y); pctx.lineTo(to.x-headLen*Math.cos(ang-0.5), to.y-headLen*Math.sin(ang-0.5));
      pctx.moveTo(to.x,to.y); pctx.lineTo(to.x-headLen*Math.cos(ang+0.5), to.y-headLen*Math.sin(ang+0.5));
    }
    pctx.stroke();
  }
  function commitShape(shape, from, to, color, size){
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle = color; ctx.lineWidth = size; ctx.globalAlpha=1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    if(shape==='line'){ ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y); }
    else if(shape==='rect'){ ctx.rect(Math.min(from.x,to.x),Math.min(from.y,to.y),Math.abs(to.x-from.x),Math.abs(to.y-from.y)); }
    else if(shape==='ellipse'){ var cx=(from.x+to.x)/2,cy=(from.y+to.y)/2,rx=Math.abs(to.x-from.x)/2,ry=Math.abs(to.y-from.y)/2; ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); }
    else if(shape==='arrow'){
      var ang=Math.atan2(to.y-from.y,to.x-from.x), headLen=Math.max(14,size*3.2);
      ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y);
      ctx.moveTo(to.x,to.y); ctx.lineTo(to.x-headLen*Math.cos(ang-0.5), to.y-headLen*Math.sin(ang-0.5));
      ctx.moveTo(to.x,to.y); ctx.lineTo(to.x-headLen*Math.cos(ang+0.5), to.y-headLen*Math.sin(ang+0.5));
    }
    ctx.stroke();
    pctx.clearRect(0,0,BOARD_W,BOARD_H);
  }

  var activePointers = new Map();
  var pinch = null;
  var pinchActive = false;

  function distanceOf(a, b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function midpointOf(a, b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

  function cancelSingleGesture(){
    if(panning){ panning = false; viewport.style.cursor = state.tool==='move' ? 'grab' : 'crosshair'; }
    if(drawing){
      drawing = false; lastPt = null; startPt = null; currentPts = [];
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      pctx.clearRect(0,0,BOARD_W,BOARD_H);
    }
  }

  viewport.addEventListener('pointerdown', function(e){
    if(e.target.closest('#context-bar') || e.target.closest('#zoom-dock')) return;
    if(e.target.classList && e.target.classList.contains('board-text')) return;
    viewport.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(activePointers.size === 2){
      cancelSingleGesture();
      var pts = Array.from(activePointers.values());
      pinch = { startDist: distanceOf(pts[0],pts[1]), startZoom: state.zoom, startMid: midpointOf(pts[0],pts[1]), startPan: {x:state.pan.x, y:state.pan.y} };
      pinchActive = true;
      lastTapTime = 0; lastTapPos = null;
      return;
    }
    if(activePointers.size > 2) return;

    downPos = {x:e.clientX, y:e.clientY};
    var pt = screenToBoard(e.clientX, e.clientY);
    if(state.tool === 'move'){
      panning = true; panStart = {x:e.clientX,y:e.clientY}; panOrigin = {x:state.pan.x,y:state.pan.y};
      viewport.style.cursor = 'grabbing';
      return;
    }
    if(state.tool === 'text'){
      var tel = makeTextEl(pt.x+'px', pt.y+'px', tools.text.color, tools.text.size+'px', tools.text.bold);
      tel.classList.add('editing');
      setTimeout(function(){ tel.focus(); }, 0);
      return;
    }
    if(state.tool === 'shape'){ startPt = pt; drawing = true; return; }
    if(state.tool === 'pen' || state.tool === 'highlighter'){
      drawing = true; currentPts = [pt];
      drawLivePenStroke();
      return;
    }
    if(state.tool === 'eraser'){
      drawing = true; lastPt = pt;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.lineWidth = tools.eraser.size; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(pt.x,pt.y); ctx.lineTo(pt.x+0.01,pt.y+0.01); ctx.stroke();
      return;
    }
  });

  viewport.addEventListener('pointermove', function(e){
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pinch && activePointers.size === 2){
      var pts = Array.from(activePointers.values());
      var dist = distanceOf(pts[0], pts[1]);
      var ratio = dist / (pinch.startDist || 1);
      var newZoom = Math.max(0.4, Math.min(3, pinch.startZoom * ratio));
      var mid = midpointOf(pts[0], pts[1]);
      var r = viewport.getBoundingClientRect();
      var ax = mid.x - r.left, ay = mid.y - r.top;
      var startAx = pinch.startMid.x - r.left, startAy = pinch.startMid.y - r.top;
      var boardX = (startAx - pinch.startPan.x)/pinch.startZoom;
      var boardY = (startAy - pinch.startPan.y)/pinch.startZoom;
      state.zoom = newZoom;
      state.pan.x = ax - boardX*state.zoom;
      state.pan.y = ay - boardY*state.zoom;
      clampPan(); applyTransform();
      return;
    }

    if(panning){
      state.pan.x = panOrigin.x + (e.clientX - panStart.x);
      state.pan.y = panOrigin.y + (e.clientY - panStart.y);
      clampPan(); applyTransform();
      return;
    }
    if(!drawing) return;
    var pt = screenToBoard(e.clientX, e.clientY);
    if(state.tool === 'shape' && startPt){ drawShapePreview(tools.shape.shape, startPt, pt, tools.shape.color, tools.shape.size); return; }
    if(state.tool === 'pen' || state.tool === 'highlighter'){
      currentPts.push(pt);
      drawLivePenStroke();
      return;
    }
    if(state.tool==='eraser' && lastPt){
      ctx.beginPath(); ctx.moveTo(lastPt.x,lastPt.y); ctx.lineTo(pt.x,pt.y); ctx.stroke();
      lastPt = pt; return;
    }
  });

  function endStroke(e){
    if(!activePointers.has(e.pointerId)) return;
    activePointers.delete(e.pointerId);

    if(pinchActive){
      pinch = null;
      if(activePointers.size === 0){
        pinchActive = false;
        lastTapTime = 0; lastTapPos = null;
      }
      return;
    }

    var dragDist = downPos ? distanceOf(downPos, {x:e.clientX, y:e.clientY}) : 999;
    var wasTap = dragDist < 8;

    if(panning){
      panning = false; viewport.style.cursor = 'grab';
      handleTapSequence(wasTap, e);
      return;
    }
    if(state.tool === 'shape' && drawing && startPt){
      var pt = screenToBoard(e.clientX, e.clientY);
      commitShape(tools.shape.shape, startPt, pt, tools.shape.color, tools.shape.size);
      drawing = false; startPt = null; pushHistory();
      handleTapSequence(wasTap, e);
      return;
    }
    if(drawing && (state.tool === 'pen' || state.tool === 'highlighter')){
      commitPenStroke();
      drawing = false; currentPts = [];
      pushHistory();
      handleTapSequence(wasTap, e);
      return;
    }
    if(drawing){
      drawing = false; lastPt = null;
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      pushHistory();
    }
    handleTapSequence(wasTap, e);
  }
  viewport.addEventListener('pointerup', endStroke);
  viewport.addEventListener('pointercancel', endStroke);
  viewport.addEventListener('pointerleave', function(e){
    if(panning || drawing) endStroke(e);
  });

  viewport.addEventListener('wheel', function(e){
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.08 : 0.08;
    setZoom(state.zoom + delta, e.clientX, e.clientY);
  }, {passive:false});

  /* ---------- fullscreen ---------- */
  var fsBtn = document.getElementById('btn-fullscreen');
  var fsIcon = document.getElementById('fs-icon');
  var EXPAND_PATH = 'M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15';
  var COLLAPSE_PATH = 'M9 4H5.5A1.5 1.5 0 0 0 4 5.5V9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15';

  function currentFsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null; }
  function fsIsSupported(){
    return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled || document.msFullscreenEnabled ||
      document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || document.documentElement.msRequestFullscreen);
  }
  function callSafely(fn, ctxObj){
    return new Promise(function(resolve, reject){
      try{
        var result = fn.call(ctxObj);
        if(result && typeof result.then === 'function'){ result.then(resolve, reject); } else { resolve(); }
      } catch(err){ reject(err); }
    });
  }
  function requestFs(){
    var elx = document.documentElement;
    var method = elx.requestFullscreen || elx.webkitRequestFullscreen || elx.msRequestFullscreen;
    if(!method) return Promise.reject(new Error('unsupported'));
    return callSafely(method, elx);
  }
  function exitFs(){
    var method = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(!method) return Promise.reject(new Error('unsupported'));
    return callSafely(method, document);
  }
  var pseudoFs = false;
  function setPseudoFs(on){ pseudoFs = on; document.body.classList.toggle('pseudo-fs', on); updateFsIcon(); }
  function updateFsIcon(){
    var isFs = !!currentFsElement() || pseudoFs;
    fsIcon.querySelector('path').setAttribute('d', isFs ? COLLAPSE_PATH : EXPAND_PATH);
    fsBtn.title = isFs ? 'إنهاء ملء الشاشة' : 'ملء الشاشة';
  }
  fsBtn.addEventListener('click', function(){
    if(currentFsElement() || pseudoFs){ exitFs().catch(function(){}); setPseudoFs(false); return; }
    if(!fsIsSupported()){ setPseudoFs(true); showToast('ملء الشاشة الكامل غير متاح هنا، فُعِّل عرض موسّع بدلاً منه'); return; }
    requestFs().then(function(){ updateFsIcon(); }).catch(function(){
      setPseudoFs(true);
      showToast('افتح رابط اللوحة في تبويب مستقل لتفعيل ملء الشاشة الكامل، وتم تفعيل عرض موسّع الآن');
    });
  });
  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('webkitfullscreenchange', updateFsIcon);
  document.addEventListener('msfullscreenchange', updateFsIcon);

  /* ---------- save as image ---------- */
  document.getElementById('btn-save').addEventListener('click', function(){
    var out = document.createElement('canvas');
    out.width = BOARD_W; out.height = BOARD_H;
    var octx = out.getContext('2d');
    var isDark = viewport.classList.contains('bg-dark');
    var isSlate = viewport.classList.contains('bg-slate');
    octx.fillStyle = isDark ? '#14161A' : (isSlate ? '#0E2A2E' : '#FBFAF6');
    octx.fillRect(0,0,BOARD_W,BOARD_H);
    octx.drawImage(canvas, 0, 0);
    textLayer.querySelectorAll('.board-text').forEach(function(elx){
      var left = parseFloat(elx.style.left)||0;
      var top = parseFloat(elx.style.top)||0;
      var fontSize = parseFloat(elx.style.fontSize)||18;
      octx.fillStyle = elx.style.color || '#1F2933';
      octx.font = (elx.classList.contains('bold')?'700 ':'400 ')+fontSize+'px Cairo, sans-serif';
      octx.textBaseline = 'top';
      octx.direction = 'rtl';
      var lines = elx.textContent.split('\n');
      lines.forEach(function(line, i){
        octx.fillText(line, left + (elx.offsetWidth||0), top + i*fontSize*1.4, elx.offsetWidth ? elx.offsetWidth*4 : 2000);
      });
    });
    var link = document.createElement('a');
    link.download = 'whiteboard-'+Date.now()+'.png';
    link.href = out.toDataURL('image/png');
    link.click();
    showToast('تم حفظ الصورة');
  });

  applyLayout();
  setTool('pen');
  requestAnimationFrame(function(){ centerInit(); });
})();
</script>
</body>
</html>
