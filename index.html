<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Studio — عارض ومحرر PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--pn:rgba(255,255,255,.88);--ink:#161c2b;--mut:#667089;--ln:#e1e5ee;--ac:#4f46e5;--acb:#eceafe;--st:#e4e8f0;--dot:#cdd3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c0f16;--pn:rgba(24,29,41,.86);--ink:#eef1f8;--mut:#8c97b0;--ln:#283042;--ac:#8b8bff;--acb:#23264a;--st:#090b10;--dot:#1b2130}}
:root[data-theme=dark]{--bg:#0c0f16;--pn:rgba(24,29,41,.86);--ink:#eef1f8;--mut:#8c97b0;--ln:#283042;--ac:#8b8bff;--acb:#23264a;--st:#090b10;--dot:#1b2130}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:.15s}
button:hover:not(:disabled){background:var(--acb)}button:disabled{opacity:.35;cursor:default}
select{border-color:var(--ln);background:var(--pn)}
button.p{background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.35)}button.p:hover:not(:disabled){filter:brightness(1.1);background:linear-gradient(135deg,#4f46e5,#9333ea)}
button.o{border-color:var(--ln)}
#bar{height:58px;flex:none;background:var(--pn);backdrop-filter:blur(16px);border-bottom:1px solid var(--ln);padding:0 16px;display:flex;align-items:center;gap:6px;z-index:6}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px;margin-inline-end:16px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#c026d3);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(120,60,220,.4)}
.brand small{display:block;font-size:10px;font-weight:400;color:var(--mut);margin-top:-4px}
.sp{flex:1}.vr{width:1px;height:24px;background:var(--ln);margin:0 6px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.logo svg{width:19px;height:19px}
.dock{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:calc(100vw - 16px);background:var(--pn);backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:22px;box-shadow:0 16px 48px rgba(20,24,60,.28);padding:10px 14px;display:flex;flex-direction:column;gap:9px;z-index:7}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
#tools{display:flex;gap:4px}
#tools button{display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;padding:8px 0 6px;border-radius:14px;font-size:11px;color:var(--mut)}
#tools button.on{background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.45)}
#pens{display:flex;gap:4px}#pens button{border:1px solid var(--ln);border-radius:999px;padding:3px 12px;font-size:12px}#pens button.on{background:var(--acb);border-color:var(--ac);color:var(--ac)}
#cols{display:flex;gap:7px;align-items:center}
.sw{width:25px;height:25px;border-radius:50%;padding:0;border:2px solid var(--pn);box-shadow:0 0 0 1px var(--ln)}
.sw.on{box-shadow:0 0 0 2.5px var(--ac);transform:scale(1.12)}
input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
input[type=range]{width:120px;accent-color:var(--ac)}
.sz{display:flex;align-items:center;gap:8px}.m{color:var(--mut);font-size:12px;font-weight:600}
.nav{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pn);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:16px;box-shadow:0 10px 30px rgba(20,24,60,.2);padding:6px 8px;display:flex;align-items:center;gap:2px;z-index:7;flex-wrap:wrap;max-width:300px}
.nav button{padding:5px 9px}
#pg{width:42px;text-align:center;border:1px solid var(--ln);border-radius:8px;background:transparent;color:var(--ink);padding:4px;font:inherit;font-size:13px}
@media(max-width:1000px){.nav{bottom:auto;top:68px;left:10px}}
#stage{flex:1;overflow:auto;background:var(--st);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;padding:26px 0 230px;position:relative}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px;min-width:max-content;padding:0 24px}
.pgx{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2),0 14px 40px rgba(10,14,40,.28);border-radius:3px;flex:none;direction:ltr}
.pgx canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:3px}
.pgx.green{background:#1f3b33}
.ov{touch-action:auto}body.draw .ov{touch-action:none}
body.t-pen .ov,body.t-hl .ov{cursor:crosshair}body.t-er .ov{cursor:cell}body.t-hand .ov{cursor:grab}
#empty{position:absolute;inset:0 0 150px;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--pn);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:26px;padding:40px 44px;text-align:center;max-width:480px;box-shadow:0 20px 60px rgba(20,24,60,.2)}
.card .logo{width:62px;height:62px;border-radius:18px;margin:0 auto 18px}.card .logo svg{width:32px;height:32px}
.card h2{margin:0 0 8px;font-size:26px}.card p{color:var(--mut);margin:0 0 22px;line-height:1.8;font-size:14px}
.card .row{gap:10px}.card button{padding:10px 20px;font-size:14px;border-radius:12px}
#drop{position:absolute;inset:12px;background:rgba(79,70,229,.14);border:3px dashed var(--ac);border-radius:22px;display:none;align-items:center;justify-content:center;font-size:26px;font-weight:700;z-index:9;pointer-events:none}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-10px);background:#161c2b;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.s{opacity:1;transform:translateX(-50%)}
.side{position:fixed;right:14px;top:50%;transform:translateY(-50%);background:var(--pn);backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:20px;box-shadow:0 14px 40px rgba(20,24,60,.25);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:7}
.side button,#tools button{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:13px;color:var(--mut)}
.side button:hover:not(:disabled){color:var(--ink)}.side svg{width:22px;height:22px}
#tools{display:flex;flex-direction:column;gap:4px}
.hr{width:26px;height:1px;background:var(--ln);margin:3px 0}
#pop{position:fixed;right:84px;top:50%;transform:translateY(-50%) translateX(12px);background:var(--pn);backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:18px;box-shadow:0 14px 40px rgba(20,24,60,.25);padding:12px 14px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;opacity:0;pointer-events:none;transition:.22s;z-index:8;max-width:min(300px,calc(100vw - 110px))}
#pop.s{opacity:1;transform:translateY(-50%);pointer-events:auto}
#cols{flex-wrap:wrap}
#pages{padding:0 86px 0 24px}#stage{padding-bottom:90px}
@media(max-height:640px){.side button,#tools button{width:36px;height:36px}.side{padding:5px;gap:2px}}
#bar{overflow-x:auto;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}#bar>*{flex:none}
#bar .nav{position:static;backdrop-filter:none;box-shadow:none;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:3px 6px;max-width:none;flex-wrap:nowrap}
#bar .nav button{padding:4px 9px;border-radius:8px}#bar .nav select{padding:4px 8px;border-radius:8px}
#bar .sp{flex:1 0 8px}
#bar button,.card button{display:inline-flex;align-items:center;gap:7px}#bar button svg,.card button svg{width:18px;height:18px}
#bar .nav button{padding:5px 8px}
#pop{transform:translate(var(--hx,12px),var(--hy,-50%))}#pop.s{transform:translate(var(--sx,0),var(--sy,-50%))}
body[data-d=right] .side{right:14px;left:auto;top:50%;bottom:auto;transform:translateY(-50%)}
body[data-d=left] .side{left:14px;right:auto;top:50%;bottom:auto;transform:translateY(-50%)}
body[data-d=top] .side{top:72px;bottom:auto;left:50%;right:auto;transform:translateX(-50%)}
body[data-d=bottom] .side{bottom:calc(16px + env(safe-area-inset-bottom,0px));top:auto;left:50%;right:auto;transform:translateX(-50%)}
body[data-d=top] .side,body[data-d=bottom] .side{flex-direction:row}
body[data-d=top] #tools,body[data-d=bottom] #tools{flex-direction:row}
body[data-d=top] .hr,body[data-d=bottom] .hr{width:1px;height:26px;margin:0 3px}
body[data-d=right] #pop{right:84px;left:auto;top:50%;bottom:auto;--hx:12px;--hy:-50%;--sx:0px;--sy:-50%}
body[data-d=left] #pop{left:84px;right:auto;top:50%;bottom:auto;--hx:-12px;--hy:-50%;--sx:0px;--sy:-50%}
body[data-d=top] #pop{top:136px;bottom:auto;left:50%;right:auto;--hx:-50%;--hy:-10px;--sx:-50%;--sy:0px}
body[data-d=bottom] #pop{bottom:calc(84px + env(safe-area-inset-bottom,0px));top:auto;left:50%;right:auto;--hx:-50%;--hy:10px;--sx:-50%;--sy:0px}
body[data-d=right] #pages{padding:0 86px 0 24px}body[data-d=left] #pages{padding:0 24px 0 86px}
body[data-d=top] #stage{padding-top:100px}body[data-d=bottom] #stage{padding-bottom:110px}
@media(max-width:560px){body[data-d=top] .side,body[data-d=bottom] .side{max-width:calc(100vw - 12px);overflow-x:auto}}
#stage,.ov,body.draw .ov{touch-action:none}
#pages{transform-origin:0 0}
#stage{overscroll-behavior:contain}
</style></head><body class="t-pen draw">

<div id="stage"><div id="pages"></div>

<script>
const $=s=>document.querySelector(s),pagesEl=$('#pages'),stage=$('#stage');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const mk=(w,h)=>({pages:[],strokes:[],hist:[],redo:[]});
const D={pdf:{pages:[],strokes:[],hist:[],redo:[],doc:null,bytes:null,name:'document'},board:{pages:[{w:595,h:842}],strokes:[[]],hist:[],redo:[],bg:'white'}};
let mode=null,tool='pen',pen='ink',color='#1a1a1a',size=2.5,scale=1.2,cur=null;
const PENS={ink:['حبر',2.5,1],marker:['ماركر',6,1],pencil:['رصاص',1.6,.75],fine:['رفيع',1,1]};
const COLS=['#1a1a1a','#e03131','#1c7ed6','#2f9e44','#f08c00','#ae3ec9','#ffffff'];
const HLC=['#ffe033','#7cf06b','#ff9ad5','#6fd3ff'];
let hlColor='#ffe033';
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2200)};
// toolbar build
const pensEl=$('#pens'),colsEl=$('#cols');
Object.entries(PENS).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v[0];b.dataset.p=k;b.onclick=()=>{pen=k;size=v[1];setTool('pen');syncUI()};pensEl.append(b)});
function buildCols(){colsEl.innerHTML='';(tool==='hl'?HLC:COLS).forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.dataset.c=c;b.onclick=()=>{setCol(c)};colsEl.append(b)});const i=document.createElement('input');i.type='color';i.value=tool==='hl'?hlColor:color;i.oninput=()=>setCol(i.value);colsEl.append(i);syncUI()}
function setCol(c){if(tool==='hl')hlColor=c;else color=c;syncUI()}
function setTool(t,q){tool=t;document.body.className='t-'+t+(t==='hand'?'':' draw');if(t==='hl'&&size<10)size=18;if(t==='pen'&&size>=10)size=PENS[pen][1];document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));buildCols();if(!q)showPop(t)}
function syncUI(){$('#sz').value=size;$('#szv').textContent=size;pensEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',tool==='pen'&&b.dataset.p===pen));colsEl.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===(tool==='hl'?hlColor:color)));const i=colsEl.querySelector('input');if(i)i.value=tool==='hl'?hlColor:color;pensEl.style.opacity=tool==='pen'?1:.45;colsEl.style.opacity=tool==='er'?.4:1}
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
$('#sz').oninput=e=>{size=+e.target.value;$('#szv').textContent=size};
// rendering
const dpr=Math.max(window.devicePixelRatio||1,2);
const RK=p=>Math.min(scale*dpr,8192/Math.max(p.w,p.h),Math.sqrt(4e7/(p.w*p.h)));
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)renderPage(e.target)}),{root:stage,rootMargin:'600px 0px'});
function bgStyle(el){const d=D.board;el.classList.remove('green');el.style.background='';if(mode!=='board')return;if(d.bg==='green')el.classList.add('green');else if(d.bg==='grid'){el.style.background='#fff';el.style.backgroundImage='linear-gradient(#cfd8e3 1px,transparent 1px),linear-gradient(90deg,#cfd8e3 1px,transparent 1px)';el.style.backgroundSize=(24*scale)+'px '+(24*scale)+'px'}}
